<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB"/>
      <stop offset="100%" style="stop-color:#E0F0FF"/>
    </linearGradient>
    <linearGradient id="building-g" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E8E0D4"/>
      <stop offset="100%" style="stop-color:#D4C8B8"/>
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4488BB"/>
      <stop offset="100%" style="stop-color:#2266AA"/>
    </linearGradient>
  </defs>

  <!-- Ciel -->
  <rect width="800" height="500" fill="url(#sky)"/>

  <!-- Soleil -->
  <circle cx="650" cy="80" r="40" fill="#FECB00" opacity="0.8"/>
  <circle cx="650" cy="80" r="50" fill="#FECB00" opacity="0.2"/>

  <!-- Nuages -->
  <g fill="white" opacity="0.7">
    <ellipse cx="150" cy="70" rx="50" ry="20"/>
    <ellipse cx="180" cy="60" rx="40" ry="18"/>
    <ellipse cx="500" cy="90" rx="60" ry="22"/>
    <ellipse cx="540" cy="80" rx="45" ry="18"/>
  </g>

  <!-- Bâtiment principal du Ministère (inspiré du vrai bâtiment) -->
  <!-- Façade principale -->
  <rect x="250" y="120" width="300" height="280" fill="url(#building-g)" rx="5"/>
  <!-- Tour centrale arrondie -->
  <g>
    <rect x="360" y="100" width="80" height="300" fill="#D8CFC0" rx="40"/>
    <ellipse cx="400" cy="100" rx="40" ry="15" fill="#CCC0B0"/>
  </g>

  <!-- Fenêtres - côté gauche -->
  <g fill="url(#glass)">
    <!-- Étage 4 -->
    <rect x="270" y="140" width="30" height="22" rx="2"/>
    <rect x="310" y="140" width="30" height="22" rx="2"/>
    <!-- Étage 3 -->
    <rect x="270" y="180" width="30" height="22" rx="2"/>
    <rect x="310" y="180" width="30" height="22" rx="2"/>
    <!-- Étage 2 -->
    <rect x="270" y="220" width="30" height="22" rx="2"/>
    <rect x="310" y="220" width="30" height="22" rx="2"/>
    <!-- Étage 1 -->
    <rect x="270" y="260" width="30" height="22" rx="2"/>
    <rect x="310" y="260" width="30" height="22" rx="2"/>
    <!-- RDC -->
    <rect x="270" y="300" width="30" height="22" rx="2"/>
    <rect x="310" y="300" width="30" height="22" rx="2"/>
  </g>

  <!-- Fenêtres - tour centrale -->
  <g fill="url(#glass)">
    <rect x="385" y="130" width="30" height="20" rx="2"/>
    <rect x="385" y="170" width="30" height="20" rx="2"/>
    <rect x="385" y="210" width="30" height="20" rx="2"/>
    <rect x="385" y="250" width="30" height="20" rx="2"/>
    <rect x="385" y="290" width="30" height="20" rx="2"/>
  </g>

  <!-- Fenêtres - côté droit -->
  <g fill="url(#glass)">
    <rect x="460" y="140" width="30" height="22" rx="2"/>
    <rect x="500" y="140" width="30" height="22" rx="2"/>
    <rect x="460" y="180" width="30" height="22" rx="2"/>
    <rect x="500" y="180" width="30" height="22" rx="2"/>
    <rect x="460" y="220" width="30" height="22" rx="2"/>
    <rect x="500" y="220" width="30" height="22" rx="2"/>
    <rect x="460" y="260" width="30" height="22" rx="2"/>
    <rect x="500" y="260" width="30" height="22" rx="2"/>
    <rect x="460" y="300" width="30" height="22" rx="2"/>
    <rect x="500" y="300" width="30" height="22" rx="2"/>
  </g>

  <!-- Entrée principale -->
  <rect x="375" y="340" width="50" height="60" rx="25" fill="url(#glass)" opacity="0.8"/>

  <!-- Drapeau du Tchad -->
  <line x1="180" y1="400" x2="180" y2="140" stroke="#888" stroke-width="3"/>
  <g transform="translate(182,140)">
    <rect x="0" y="0" width="14" height="40" fill="#002664"/>
    <rect x="14" y="0" width="14" height="40" fill="#FECB00"/>
    <rect x="28" y="0" width="14" height="40" fill="#C60C30"/>
  </g>

  <!-- Sol / trottoir -->
  <rect x="0" y="400" width="800" height="100" fill="#C8B898"/>
  <rect x="200" y="400" width="400" height="15" fill="#A09080" rx="2"/>

  <!-- Texte bannière sur le bâtiment -->
  <rect x="260" y="350" width="280" height="30" fill="#002664" rx="3"/>
  <text x="400" y="370" text-anchor="middle" font-family="sans-serif" font-size="8" fill="white" font-weight="bold">MINISTÈRE DES TÉLÉCOMMUNICATIONS, DE L'ÉCONOMIE NUMÉRIQUE</text>
  <text x="400" y="380" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#FECB00">ET DE LA DIGITALISATION DE L'ADMINISTRATION</text>

  <!-- Logos des organismes en bas -->
  <g transform="translate(230,420)">
    <circle cx="0" cy="0" r="12" fill="white" stroke="#002664" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" font-size="5" fill="#002664" font-weight="bold">ADETIC</text>
  </g>
  <g transform="translate(280,420)">
    <circle cx="0" cy="0" r="12" fill="white" stroke="#C60C30" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" font-size="5" fill="#C60C30" font-weight="bold">ARCEP</text>
  </g>
  <g transform="translate(330,420)">
    <circle cx="0" cy="0" r="12" fill="white" stroke="#D4A900" stroke-width="1"/>
    <text x="0" y="3" text-anchor="middle" font-size="4" fill="#D4A900" font-weight="bold">POSTE</text>
  </g>
  <g transform="translate(380,420)">
    <circle cx="0" cy="0" r="12" fill="white" stroke="#003a94" stroke-width="1"/>
    <text x="0" y="3" text-anchor="middle" font-size="4" fill="#003a94" font-weight="bold">ENASTIC</text>
  </g>
  <g transform="translate(430,420)">
    <circle cx="0" cy="0" r="12" fill="white" stroke="#0066CC" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" font-size="5" fill="#0066CC" font-weight="bold">PATN</text>
  </g>
  <g transform="translate(480,420)">
    <circle cx="0" cy="0" r="12" fill="white" stroke="#1a8a3f" stroke-width="1"/>
    <text x="0" y="3" text-anchor="middle" font-size="4" fill="#1a8a3f" font-weight="bold">SAFITEL</text>
  </g>

  <!-- Armoiries sur le bâtiment -->
  <g transform="translate(400,110) scale(0.3)">
    <circle cx="0" cy="0" r="30" fill="white" opacity="0.9"/>
    <circle cx="0" cy="0" r="25" fill="none" stroke="#FECB00" stroke-width="2"/>
    <path d="M-12,-8 L-6,0 L0,-8 L6,0 L12,-8" stroke="#002664" stroke-width="2" fill="none"/>
    <circle cx="0" cy="-18" r="5" fill="#C60C30"/>
  </g>
</svg>
