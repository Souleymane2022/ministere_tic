      <stop offset="0%" style="stop-color:#002664"/>
      <stop offset="100%" style="stop-color:#0055cc"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="20" fill="white"/>
  <rect x="2" y="2" width="116" height="116" rx="18" fill="none" stroke="url(#adetic-g)" stroke-width="2"/>
  <!-- Globe/réseau -->
  <circle cx="60" cy="50" r="28" fill="none" stroke="url(#adetic-g)" stroke-width="2.5"/>
  <ellipse cx="60" cy="50" rx="14" ry="28" fill="none" stroke="url(#adetic-g)" stroke-width="1.5"/>
  <line x1="32" y1="50" x2="88" y2="50" stroke="url(#adetic-g)" stroke-width="1.5"/>
  <line x1="60" y1="22" x2="60" y2="78" stroke="url(#adetic-g)" stroke-width="1.5"/>
  <!-- Points de connexion -->
  <circle cx="45" cy="35" r="3" fill="#FECB00"/>
  <circle cx="75" cy="42" r="3" fill="#C60C30"/>
  <circle cx="52" cy="65" r="3" fill="#FECB00"/>
  <circle cx="70" cy="60" r="3" fill="#002664"/>
  <!-- Lignes de connexion -->
  <line x1="45" y1="35" x2="75" y2="42" stroke="#FECB00" stroke-width="1" opacity="0.5"/>
  <line x1="52" y1="65" x2="70" y2="60" stroke="#FECB00" stroke-width="1" opacity="0.5"/>
  <!-- Texte -->
  <text x="60" y="98" text-anchor="middle" font-family="'Poppins',sans-serif" font-size="14" font-weight="700" fill="#002664">ADETIC</text>
  <text x="60" y="110" text-anchor="middle" font-family="sans-serif" font-size="5" fill="#888">AGENCE DE DÉVELOPPEMENT DES TIC</text>
