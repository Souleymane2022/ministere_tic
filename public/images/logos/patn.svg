<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="patn-g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066CC"/>
      <stop offset="100%" style="stop-color:#004499"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="20" fill="white"/>
  <rect x="2" y="2" width="116" height="116" rx="18" fill="none" stroke="url(#patn-g)" stroke-width="2"/>
  <!-- Carte du Tchad stylisée -->
  <g transform="translate(60,48) scale(0.8)">
    <path d="M-5,-35 L15,-30 L25,-20 L30,-5 L35,5 L25,15 L20,25 L10,30 L-5,35 L-15,30 L-25,20 L-30,10 L-25,-5 L-20,-15 L-15,-25 Z" fill="url(#patn-g)" opacity="0.15" stroke="url(#patn-g)" stroke-width="1.5"/>
    <!-- Points de connexion / accès numérique -->
    <circle cx="0" cy="0" r="4" fill="#FECB00"/>
    <circle cx="-15" cy="-10" r="3" fill="#0066CC"/>
    <circle cx="15" cy="-8" r="3" fill="#0066CC"/>
    <circle cx="-10" cy="15" r="3" fill="#0066CC"/>
    <circle cx="10" cy="12" r="3" fill="#0066CC"/>
    <circle cx="20" cy="5" r="2.5" fill="#0066CC" opacity="0.6"/>
    <circle cx="-20" cy="5" r="2.5" fill="#0066CC" opacity="0.6"/>
    <!-- Lignes de connexion -->
    <g stroke="#FECB00" stroke-width="1" opacity="0.5">
      <line x1="0" y1="0" x2="-15" y2="-10"/>
      <line x1="0" y1="0" x2="15" y2="-8"/>
      <line x1="0" y1="0" x2="-10" y2="15"/>
      <line x1="0" y1="0" x2="10" y2="12"/>
      <line x1="0" y1="0" x2="20" y2="5"/>
      <line x1="0" y1="0" x2="-20" y2="5"/>
    </g>
    <!-- Signal wifi -->
    <g transform="translate(0,-5)" stroke="#C60C30" stroke-width="1.5" fill="none">
      <path d="M-8,-8 Q0,-14 8,-8" opacity="0.4"/>
      <path d="M-12,-12 Q0,-20 12,-12" opacity="0.25"/>
    </g>
  </g>
  <!-- Texte -->
  <text x="60" y="98" text-anchor="middle" font-family="'Poppins',sans-serif" font-size="14" font-weight="700" fill="#0066CC">PATN</text>
  <text x="60" y="110" text-anchor="middle" font-family="sans-serif" font-size="4.5" fill="#888">PROJET D'APPUI À LA</text>
  <text x="60" y="116" text-anchor="middle" font-family="sans-serif" font-size="4.5" fill="#888">TRANSFORMATION NUMÉRIQUE</text>
</svg>
