    <line x1="0" y1="0" x2="0" y2="20" stroke="url(#enastic-g)" stroke-width="1"/>
    <!-- Lignes de texte -->
    <g stroke="#003a94" stroke-width="0.7" opacity="0.4">
      <line x1="-18" y1="2" x2="-4" y2="5"/>
      <line x1="-17" y1="6" x2="-5" y2="9"/>
