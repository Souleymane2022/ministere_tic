  <!-- Circuits numériques -->
  <g stroke="#FECB00" stroke-width="1" opacity="0.6">
    <circle cx="92" cy="32" r="2" fill="#FECB00"/>
    <line x1="92" y1="34" x2="92" y2="42"/>
    <circle cx="28" cy="32" r="2" fill="#FECB00"/>
