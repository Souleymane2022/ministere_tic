    <path d="M0,0 L22,-5 L22,15 L0,20 Z" fill="url(#enastic-g)" opacity="0.15"/>
    <path d="M-22,-5 L0,0 L22,-5" fill="none" stroke="url(#enastic-g)" stroke-width="1.5"/>
