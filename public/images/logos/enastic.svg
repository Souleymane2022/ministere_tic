      <stop offset="0%" style="stop-color:#003a94"/>
      <stop offset="100%" style="stop-color:#0055cc"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="20" fill="white"/>
  <rect x="2" y="2" width="116" height="116" rx="18" fill="none" stroke="url(#enastic-g)" stroke-width="2"/>
  <!-- Chapeau de diplômé -->
