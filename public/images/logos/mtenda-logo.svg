<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <defs>
    <linearGradient id="mtenda-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#002664"/>
      <stop offset="100%" style="stop-color:#003a94"/>
    </linearGradient>
  </defs>
  <!-- Cercle emblème -->
  <circle cx="30" cy="30" r="26" fill="url(#mtenda-grad)"/>
  <circle cx="30" cy="30" r="22" fill="none" stroke="#FECB00" stroke-width="1.5"/>
  <!-- Zigzag simplifié du bouclier -->
  <path d="M18,22 L24,30 L30,22 L36,30 L42,22" stroke="#FECB00" stroke-width="2" fill="none"/>
  <path d="M20,30 L26,38 L32,30 L38,38" stroke="#FECB00" stroke-width="2" fill="none"/>
  <!-- Soleil -->
  <circle cx="30" cy="16" r="4" fill="#C60C30"/>
  <g stroke="#C60C30" stroke-width="1">
    <line x1="30" y1="9" x2="30" y2="6"/>
    <line x1="25" y1="11" x2="23" y2="8"/>
    <line x1="35" y1="11" x2="37" y2="8"/>
  </g>
  <!-- Texte -->
  <text x="65" y="25" font-family="'Poppins',sans-serif" font-size="18" font-weight="700" fill="#002664">MTENDA</text>
  <text x="65" y="42" font-family="'Poppins',sans-serif" font-size="7" fill="#666" letter-spacing="0.5">MINISTÈRE DES TÉLÉCOMMUNICATIONS</text>
  <text x="65" y="52" font-family="'Poppins',sans-serif" font-size="6" fill="#999">REPUBLIQUE DU TCHAD</text>
  <!-- Bande tricolore -->
  <rect x="65" y="44" width="20" height="2" fill="#002664"/>
  <rect x="85" y="44" width="20" height="2" fill="#FECB00"/>
  <rect x="105" y="44" width="20" height="2" fill="#C60C30"/>
</svg>
