<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="fo-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#001030"/>
      <stop offset="100%" style="stop-color:#002664"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0%" style="stop-color:#FECB00;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#FECB00;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#fo-bg)"/>
  <!-- Câbles de fibre optique -->
  <g stroke-width="3" fill="none">
    <path d="M0,200 Q100,150 200,200 Q300,250 400,200 Q500,150 600,200" stroke="#0088ff" opacity="0.5"/>
    <path d="M0,220 Q100,170 200,220 Q300,270 400,220 Q500,170 600,220" stroke="#00aaff" opacity="0.4"/>
    <path d="M0,180 Q100,130 200,180 Q300,230 400,180 Q500,130 600,180" stroke="#FECB00" opacity="0.6"/>
  </g>
  <!-- Points lumineux sur la fibre -->
  <g>
    <circle cx="100" cy="175" r="6" fill="url(#glow)"/><circle cx="100" cy="175" r="3" fill="#FECB00"/>
    <circle cx="200" cy="200" r="8" fill="url(#glow)"/><circle cx="200" cy="200" r="4" fill="#00aaff"/>
    <circle cx="300" cy="225" r="6" fill="url(#glow)"/><circle cx="300" cy="225" r="3" fill="#FECB00"/>
    <circle cx="400" cy="200" r="8" fill="url(#glow)"/><circle cx="400" cy="200" r="4" fill="#00aaff"/>
    <circle cx="500" cy="175" r="6" fill="url(#glow)"/><circle cx="500" cy="175" r="3" fill="#FECB00"/>
  </g>
  <!-- Texte -->
  <text x="300" y="100" text-anchor="middle" font-family="'Poppins',sans-serif" font-size="30" font-weight="700" fill="white">FIBRE OPTIQUE</text>
  <text x="300" y="130" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#FECB00">Connecter le Tchad au Haut Débit</text>
  <text x="300" y="340" text-anchor="middle" font-family="sans-serif" font-size="40" fill="white" opacity="0.08" font-weight="700">7 200 KM</text>
</svg>
