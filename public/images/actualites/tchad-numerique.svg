<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="tn-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#002664"/>
      <stop offset="100%" style="stop-color:#003a94"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#tn-bg)"/>
  <!-- Réseau de points connectés -->
  <g fill="white" opacity="0.1">
    <circle cx="100" cy="100" r="80"/>
    <circle cx="500" cy="300" r="100"/>
    <circle cx="300" cy="50" r="60"/>
  </g>
  <!-- Circuit board pattern -->
  <g stroke="#FECB00" stroke-width="1" opacity="0.2">
    <line x1="50" y1="200" x2="250" y2="200"/>
    <line x1="250" y1="200" x2="250" y2="100"/>
    <line x1="250" y1="100" x2="400" y2="100"/>
    <line x1="400" y1="100" x2="400" y2="250"/>
    <line x1="400" y1="250" x2="550" y2="250"/>
    <circle cx="250" cy="200" r="4" fill="#FECB00"/>
    <circle cx="250" cy="100" r="4" fill="#FECB00"/>
    <circle cx="400" cy="100" r="4" fill="#FECB00"/>
    <circle cx="400" cy="250" r="4" fill="#FECB00"/>
  </g>
  <!-- 2030 -->
  <text x="300" y="220" text-anchor="middle" font-family="'Poppins',sans-serif" font-size="100" font-weight="700" fill="white" opacity="0.1">2030</text>
  <!-- Titre -->
  <text x="300" y="170" text-anchor="middle" font-family="'Poppins',sans-serif" font-size="28" font-weight="700" fill="white">TCHAD NUMÉRIQUE</text>
  <text x="300" y="210" text-anchor="middle" font-family="'Poppins',sans-serif" font-size="16" fill="#FECB00">Programme National 2030</text>
  <!-- Bande tricolore -->
  <rect x="220" y="235" width="50" height="4" fill="#002664" rx="2"/>
  <rect x="270" y="235" width="50" height="4" fill="#FECB00" rx="2"/>
  <rect x="320" y="235" width="50" height="4" fill="#C60C30" rx="2"/>
  <!-- Icônes en bas -->
  <g transform="translate(150,300)" fill="white" opacity="0.5">
    <circle cx="0" cy="0" r="20" fill="none" stroke="white" stroke-width="1.5"/>
    <text x="0" y="5" text-anchor="middle" font-size="10">📡</text>
    <text x="0" y="30" text-anchor="middle" font-size="8">Telecom</text>
  </g>
  <g transform="translate(300,300)" fill="white" opacity="0.5">
    <circle cx="0" cy="0" r="20" fill="none" stroke="white" stroke-width="1.5"/>
    <text x="0" y="5" text-anchor="middle" font-size="10">💻</text>
    <text x="0" y="30" text-anchor="middle" font-size="8">E-Gouv</text>
  </g>
  <g transform="translate(450,300)" fill="white" opacity="0.5">
    <circle cx="0" cy="0" r="20" fill="none" stroke="white" stroke-width="1.5"/>
    <text x="0" y="5" text-anchor="middle" font-size="10">🎓</text>
    <text x="0" y="30" text-anchor="middle" font-size="8">Formation</text>
  </g>
</svg>
