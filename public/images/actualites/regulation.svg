    <path d="M0,-100 L100,-60 L100,20 Q100,80 0,110 Q-100,80 -100,20 L-100,-60 Z" fill="none" stroke="#C60C30" stroke-width="3" opacity="0.3"/>
    <path d="M0,-80 L80,-48 L80,16 Q80,64 0,88 Q-80,64 -80,16 L-80,-48 Z" fill="#C60C30" opacity="0.05"/>
