<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <rect width="600" height="400" fill="#002664"/>
  <!-- Globe -->
  <g transform="translate(300,190)">
    <circle cx="0" cy="0" r="100" fill="none" stroke="white" stroke-width="2" opacity="0.2"/>
    <ellipse cx="0" cy="0" rx="50" ry="100" fill="none" stroke="white" stroke-width="1" opacity="0.15"/>
    <ellipse cx="0" cy="0" rx="100" ry="40" fill="none" stroke="white" stroke-width="1" opacity="0.15"/>
    <line x1="-100" y1="0" x2="100" y2="0" stroke="white" stroke-width="0.5" opacity="0.1"/>
    <line x1="0" y1="-100" x2="0" y2="100" stroke="white" stroke-width="0.5" opacity="0.1"/>
    <!-- Points Afrique -->
    <circle cx="-10" cy="-20" r="6" fill="#FECB00"/>
    <circle cx="30" cy="10" r="5" fill="#C60C30"/>
    <circle cx="-30" cy="15" r="5" fill="#FECB00" opacity="0.7"/>
    <circle cx="10" cy="40" r="4" fill="white" opacity="0.5"/>
    <!-- Connections -->
    <line x1="-10" y1="-20" x2="30" y2="10" stroke="#FECB00" stroke-width="1.5" opacity="0.5"/>
    <line x1="30" y1="10" x2="-30" y2="15" stroke="#FECB00" stroke-width="1.5" opacity="0.5"/>
    <line x1="-30" y1="15" x2="10" y2="40" stroke="#FECB00" stroke-width="1.5" opacity="0.5"/>
  </g>
  <!-- Drapeaux / mains -->
  <g transform="translate(170,300)">
    <rect x="0" y="0" width="8" height="25" fill="#002664"/>
    <rect x="8" y="0" width="8" height="25" fill="#FECB00"/>
    <rect x="16" y="0" width="8" height="25" fill="#C60C30"/>
  </g>
  <g transform="translate(405,300)">
    <rect x="0" y="0" width="8" height="25" fill="#009639"/>
    <rect x="8" y="0" width="8" height="25" fill="#FECB00"/>
    <rect x="16" y="0" width="8" height="25" fill="#C60C30"/>
  </g>
  <text x="300" y="350" text-anchor="middle" font-family="'Poppins',sans-serif" font-size="22" font-weight="700" fill="white">COOPÉRATION INTERNATIONALE</text>
  <text x="300" y="375" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#FECB00">Partenariats Stratégiques Numériques</text>
</svg>
