<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="form-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#003a94"/>
      <stop offset="100%" style="stop-color:#0055cc"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#form-bg)"/>
  <!-- Étudiants stylisés -->
  <g transform="translate(300,250)">
    <!-- Bureau / ordinateur -->
    <g opacity="0.3">
      <rect x="-150" y="30" width="300" height="5" fill="white" rx="2"/>
      <rect x="-100" y="-10" width="60" height="40" rx="3" fill="white" opacity="0.15" stroke="white" stroke-width="1"/>
      <rect x="-20" y="-10" width="60" height="40" rx="3" fill="white" opacity="0.15" stroke="white" stroke-width="1"/>
      <rect x="60" y="-10" width="60" height="40" rx="3" fill="white" opacity="0.15" stroke="white" stroke-width="1"/>
    </g>
    <!-- Personnes -->
    <g fill="white" opacity="0.4">
      <circle cx="-70" cy="-40" r="12"/>
      <rect x="-80" y="-28" width="20" height="25" rx="5"/>
      <circle cx="10" cy="-40" r="12"/>
      <rect x="0" y="-28" width="20" height="25" rx="5"/>
      <circle cx="90" cy="-40" r="12"/>
      <rect x="80" y="-28" width="20" height="25" rx="5"/>
    </g>
  </g>
  <!-- Code / symboles numériques -->
  <g fill="#FECB00" opacity="0.15" font-family="monospace" font-size="14">
    <text x="50" y="50">01001 11010</text>
    <text x="400" y="80">10110 01101</text>
    <text x="100" y="370">11001 10010</text>
    <text x="450" y="350">01110 11001</text>
  </g>
  <!-- Chapeau diplômé géant -->
  <g transform="translate(300,100)">
    <polygon points="0,-30 80,0 0,15 -80,0" fill="#FECB00" opacity="0.8"/>
    <line x1="0" y1="15" x2="0" y2="0" stroke="#D4A900" stroke-width="3"/>
    <circle cx="0" cy="18" r="3" fill="#D4A900"/>
  </g>
  <!-- Texte -->
  <text x="300" y="160" text-anchor="middle" font-family="'Poppins',sans-serif" font-size="24" font-weight="700" fill="white">FORMATION NUMÉRIQUE</text>
  <text x="300" y="185" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#FECB00">5 000 Jeunes • Métiers du Numérique</text>
</svg>
