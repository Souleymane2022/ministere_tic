<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="eg-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C60C30"/>
      <stop offset="100%" style="stop-color:#9E0A26"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#eg-bg)"/>
  <!-- Bâtiment gouvernemental stylisé -->
  <g transform="translate(300,180)" fill="white" opacity="0.15">
    <rect x="-60" y="-40" width="120" height="80" rx="3"/>
    <polygon points="-80,-40 0,-80 80,-40"/>
    <!-- Colonnes -->
    <rect x="-45" y="-30" width="8" height="70"/>
    <rect x="-20" y="-30" width="8" height="70"/>
    <rect x="12" y="-30" width="8" height="70"/>
    <rect x="37" y="-30" width="8" height="70"/>
  </g>
  <!-- Écran / interface numérique -->
  <g transform="translate(300,180)">
    <rect x="-40" y="-20" width="80" height="50" rx="5" fill="white" opacity="0.1" stroke="white" stroke-width="1.5"/>
    <!-- Éléments UI -->
    <rect x="-30" y="-10" width="25" height="3" rx="1" fill="white" opacity="0.3"/>
    <rect x="-30" y="-3" width="18" height="3" rx="1" fill="#FECB00" opacity="0.5"/>
    <rect x="-30" y="4" width="22" height="3" rx="1" fill="white" opacity="0.2"/>
    <rect x="5" y="-10" width="25" height="20" rx="2" fill="white" opacity="0.1"/>
    <circle cx="-10" cy="18" r="5" fill="#FECB00" opacity="0.5"/>
    <circle cx="5" cy="18" r="5" fill="white" opacity="0.2"/>
    <circle cx="20" cy="18" r="5" fill="white" opacity="0.2"/>
  </g>
  <text x="300" y="310" text-anchor="middle" font-family="'Poppins',sans-serif" font-size="24" font-weight="700" fill="white">E-GOUVERNANCE</text>
  <text x="300" y="340" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#FECB00">Digitalisation des Services Publics</text>
</svg>
