<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="pm-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4A900"/>
      <stop offset="100%" style="stop-color:#FECB00"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#pm-bg)"/>
  <!-- Enveloppe géante -->
  <g transform="translate(300,180)">
    <rect x="-100" y="-50" width="200" height="120" rx="8" fill="white" opacity="0.3" stroke="white" stroke-width="2"/>
    <path d="M-100,-50 L0,20 L100,-50" fill="none" stroke="white" stroke-width="2"/>
    <!-- Smartphone à côté -->
    <g transform="translate(130,0)">
      <rect x="-20" y="-40" width="40" height="70" rx="5" fill="white" opacity="0.25" stroke="white" stroke-width="1.5"/>
      <rect x="-15" y="-30" width="30" height="45" rx="2" fill="#002664" opacity="0.2"/>
      <circle cx="0" cy="22" r="4" fill="white" opacity="0.3"/>
    </g>
    <!-- Mobile money symbole -->
    <text x="-130" y="10" font-family="sans-serif" font-size="40" fill="white" opacity="0.2">💰</text>
    <!-- Code QR simplifié -->
    <g transform="translate(-130,-30)" fill="white" opacity="0.15">
      <rect x="0" y="0" width="5" height="5"/>
      <rect x="7" y="0" width="5" height="5"/>
      <rect x="14" y="0" width="5" height="5"/>
      <rect x="0" y="7" width="5" height="5"/>
      <rect x="14" y="7" width="5" height="5"/>
      <rect x="0" y="14" width="5" height="5"/>
      <rect x="7" y="14" width="5" height="5"/>
      <rect x="14" y="14" width="5" height="5"/>
    </g>
  </g>
  <text x="300" y="330" text-anchor="middle" font-family="'Poppins',sans-serif" font-size="24" font-weight="700" fill="#002664">LA POSTE NUMÉRIQUE</text>
  <text x="300" y="360" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#002664" opacity="0.7">Modernisation des Services Postaux</text>
</svg>
